<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Akshayaraja E</title>

    <link rel="icon" type="image/jpg" href="assets/images/ak.jpg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">

            <a href="index.html" class="logo">AKSHAYARAJA</a>

            <ul class="nav-links">
                <li>
                    <a href="index.html" class="nav-link">Home</a>
                </li>

                <li>
                    <a href="projects.html" class="nav-link">Projects</a>
                </li>

                <li>
                    <a href="certificates.html" class="nav-link">Certificates</a>
                </li>

                <li>
                    <a href="contact.html" class="nav-link active">Contact</a>
                </li>
            </ul>

            <div style="display: flex; align-items: center; gap: 15px;">

                <!-- Theme Toggle -->
                <button id="theme-toggle" class="theme-toggle">
                    <span>🌙</span>
                </button>

                <!-- Mobile Menu -->
                <button class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>

            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container section">

        <h1 class="page-title">Get In Touch</h1>

        <div class="card contact-wrapper">

            <!-- Contact Form -->
            <form id="contact-form"
                  action="https://formspree.io/f/mbglrlnr"
                  method="POST">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        placeholder="Your Name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Your Email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Message -->
                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        class="form-control"
                        rows="5"
                        placeholder="Your Message"
                        required
                    ></textarea>

                </div>


                <!-- Email Subject -->
                <input
                    type="hidden"
                    name="_subject"
                    value="New Message from Akshayaraja Portfolio"
                >


                <!-- Send Button -->
                <button
                    type="submit"
                    class="btn"
                    style="width: 100%;"
                >
                    Send Message
                </button>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="container">

            <p>
                &copy; 2024 Akshayaraja E. All rights reserved.
            </p>

            <div class="social-links">

                <a href="mailto:akshayarajae@gmail.com">
                    akshayarajae@gmail.com
                </a>

            </div>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
